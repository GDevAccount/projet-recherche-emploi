# fly.toml app configuration file generated for projet-recherche-emploi on 2026-10-06T13:18:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'projet-recherche-emploi'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# Sans ce volume, /data est remis à zéro à chaque redémarrage de la machine
[mounts]
  source = 'data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
