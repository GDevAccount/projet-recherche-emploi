<p-card header="Recherche d'emploi">
  <p>Le nouveau front est en construction. Cette page vérifie qu'il joint l'API.</p>
  @switch (state()) {
    @case ('ok') {
      <p-tag severity="success" value="API : ok" />
    }
    @case ('error') {
      <p-tag severity="danger" value="API injoignable" />
    }
    @default {
      <p-tag severity="secondary" value="Appel de l'API…" />
    }
  }
</p-card>
