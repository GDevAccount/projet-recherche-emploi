<header>
<div class="bar">
  <a class="brand" routerLink="/" aria-label="JobGrep, accueil">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <circle cx="11" cy="11" r="6.5" />
        <path d="m16 16 4.5 4.5" />
      </svg>
    </span>
    JobGrep
  </a>

  <nav id="sections" aria-label="Sections de la page" [class.open]="menuOpen()">
    @for (section of sections; track section.id) {
      <a [href]="'/#' + section.id" (click)="goTo($event, section.id)">{{ section.label }}</a>
    }
    <a class="login-inline" [routerLink]="loginPath">Se connecter</a>
  </nav>

  <div class="actions">
    <button
      type="button"
      class="icon"
      [attr.aria-label]="theme.dark() ? 'Passer au thème clair' : 'Passer au thème sombre'"
      (click)="theme.toggle()"
    >
      @if (theme.dark()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
          <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" />
        </svg>
      }
    </button>
    <a class="login" [routerLink]="loginPath">Se connecter</a>
    <a class="cta small" [routerLink]="startPath">Commencer<span> gratuitement</span></a>
    <button
      type="button"
      class="icon menu"
      aria-controls="sections"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
      (click)="menuOpen.set(!menuOpen())"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        @if (menuOpen()) {
          <path d="M6 6l12 12M18 6 6 18" />
        } @else {
          <path d="M4 7h16M4 12h16M4 17h16" />
        }
      </svg>
    </button>
  </div>
</div>
</header>
