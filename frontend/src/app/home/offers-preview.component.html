<figure>
  <!-- Lu à la place de la maquette, cachée aux lecteurs d'écran -->
  <figcaption class="sr-only">
    Aperçu de l'écran Offres avec des données fictives : deux offres à traiter, chacune avec la raison pour laquelle
    elle correspond au CV, et deux candidatures suivies, dont une avec un entretien obtenu.
  </figcaption>

  <div class="window" inert aria-hidden="true">
    <div class="chrome">
      <span class="lights"><i></i><i></i><i></i></span>
      <span class="address">jobgrep.fr/offres</span>
      <span class="sample">Données fictives</span>
    </div>

    <div class="screen">
      <div class="bar">
        <span class="brand">
          <span class="mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <circle cx="11" cy="11" r="6.5" />
              <path d="m16 16 4.5 4.5" />
            </svg>
          </span>
          JobGrep
        </span>
        <span class="tabs"><b>Offres</b><span>Rejets</span><span>Profil</span></span>
        <span class="launch">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5Z" />
          </svg>
          Lancer une recherche
        </span>
      </div>

      <div class="stats">
        <div class="tile accent"><strong>2</strong><span>à traiter</span></div>
        <div class="tile"><strong>2</strong><span>candidatures envoyées</span></div>
        <div class="tile"><strong>1</strong><span>entretien</span></div>
        <div class="tile wide">
          <span class="meter-head"><span><b>2</b> offres sur <b>4</b> ont reçu une candidature</span><strong>50 %</strong></span>
          <span class="meter"><span></span></span>
        </div>
      </div>

      <div class="board">
        <section>
          <h3>À traiter <span>{{ todo.length }}</span></h3>
          @for (job of todo; track job.id) {
            <app-job-card [job]="job" />
          }
        </section>
        <section class="followed">
          <h3>Candidatures <span>{{ applied.length }}</span></h3>
          @for (job of applied; track job.id) {
            <app-job-card [job]="job" />
          }
        </section>
      </div>
    </div>
  </div>
</figure>
