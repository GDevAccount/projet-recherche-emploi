@if (picture(); as source) {
  <!-- Sans referrer : Google refuse parfois de servir une photo demandée depuis un autre site -->
  <img [src]="source" alt="" referrerpolicy="no-referrer" (error)="failed.set(true)" />
} @else if (initial()) {
  <span aria-hidden="true">{{ initial() }}</span>
} @else {
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="8.5" r="3.5" />
    <path d="M5 20c.8-3.4 3.5-5 7-5s6.2 1.6 7 5" />
  </svg>
}
