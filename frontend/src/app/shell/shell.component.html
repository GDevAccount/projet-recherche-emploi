<header>
  <h1>Recherche d'emploi</h1>
  @if (account(); as account) {
    @if (account.remaining_searches !== null) {
      <span class="quota">
        Recherches restantes aujourd'hui : {{ account.remaining_searches }} sur {{ account.max_searches_per_day }}
      </span>
    }
  }
  <p-button label="Se déconnecter" severity="secondary" [outlined]="true" [loading]="closing()" (onClick)="logout()" />
</header>

<div class="layout">
  <aside>
    <section>
      <h2>CV</h2>
      <p class="placeholder">À venir.</p>
    </section>
    <section>
      <h2>Postes recherchés</h2>
      <p class="placeholder">À venir.</p>
    </section>
  </aside>

  <main>
    <p-tabs value="jobs">
      <p-tablist>
        <p-tab value="jobs">Offres retenues</p-tab>
        <p-tab value="rejected">Pages rejetées</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel value="jobs"><p class="placeholder">À venir.</p></p-tabpanel>
        <p-tabpanel value="rejected"><p class="placeholder">À venir.</p></p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </main>
</div>
