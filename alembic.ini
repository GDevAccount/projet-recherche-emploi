# Sert à la commande alembic du développeur (créer une migration, voir la version de la base).
# L'application, elle, applique les migrations toute seule à son démarrage, sans lire ce fichier.
[alembic]
script_location = src/projet_recherche_emploi/data/migrations
# Numéros à la suite (0001, 0002…) : l'ordre des migrations se lit dans le nom des fichiers
file_template = %%(rev)s_%%(slug)s
